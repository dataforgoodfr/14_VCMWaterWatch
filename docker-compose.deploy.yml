services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nocodb}
      POSTGRES_USER: ${POSTGRES_USER:-nocodb}
      # generated by Coolify
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nocodb}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nocodb:
    image: "nocodb/nocodb:0.301.1"
    expose:
      - 8080
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER:-nocodb}&p=${SERVICE_PASSWORD_POSTGRES}&d=${POSTGRES_DB:-nocodb}"
    volumes:
      - nocodb-data:/usr/app/data
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        - NOCODB_BASE_ID=${NOCODB_BASE_ID}
        - NOCODB_URL=${NOCODB_URL}
        - NOCODB_TOKEN=${NOCODB_TOKEN}
    expose:
      - 3000
    environment:
      - NOCODB_BASE_ID=${NOCODB_BASE_ID}
      - NOCODB_URL=${NOCODB_URL}
      - NOCODB_TOKEN=${NOCODB_TOKEN}
      - SERVICE_URL_WEBAPP-SERVICE_3000=/
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1536
    depends_on:
      - nocodb
    restart: unless-stopped

volumes:
  postgres-data:
  nocodb-data:
