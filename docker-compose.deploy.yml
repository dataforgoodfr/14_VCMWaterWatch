networks:
  # Coolify automatically adds an additional, internal network
  # The ONLY containers that need to be on the coolify network,
  # are the ones that need direct access to the externally declared resources
  # (i.e. the postgres server)
  coolify:
    external: true

services:
  # Not used!  This is normally provided by Coolify (in resources)
  # postgres:
  #   image: postgres:18-alpine
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-nocodb}
  #     POSTGRES_USER: ${POSTGRES_USER:-nocodb}
  #     # generated by Coolify
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #     PGDATA: /var/lib/postgresql/data
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nocodb}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   restart: unless-stopped

  nocodb:
    image: "nocodb/nocodb:0.301.1"
    expose:
      - 8080
    # To expose the port on the host
    # ports:
    #   - "8500:8080"
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    environment:
      # Set up POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and POSTGRES_SERVER in Coolify
      NC_DB: "pg://${POSTGRES_SERVER:-postgres}:5432?u=${POSTGRES_USER:-nocodb}&p=${POSTGRES_PASSWORD:-changeme}&d=${POSTGRES_DB:-nocodb}"
      NC_ALLOW_LOCAL_HOOKS: true
    volumes:
      - nocodb-data:/usr/app/data
    restart: unless-stopped
    networks:
      - coolify

  webapp:
    image: ghcr.io/dataforgoodfr/14_vcmwaterwatch/webapp:latest
    pull_policy: always
    expose:
      - 3000
    environment:
      # Provide those in the Coolify UI
      - NOCODB_BASE_ID=${NOCODB_BASE_ID}
      - NOCODB_TOKEN=${NOCODB_TOKEN}
      - NOCODB_URL=${NOCODB_URL:-http://nocodb:8080}
      - NODE_ENV=production
      - PM_TILES_DIR=${PM_TILES_DIR:-/public/pmtiles}
      - COUNTRY_IMAGES_DIR=${COUNTRY_IMAGES_DIR:-/public/country-images}
      # Limit mem - otherwise it won't build on the Coolify VM
    depends_on:
      - nocodb
    restart: unless-stopped
    volumes:
      - pmtiles-data:/public/pmtiles
      - country-images-data:/public/country-images
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    labels:
      - 'traefik.http.middlewares.mybasicauth.basicauth.users=vcm:$2y$05$U9xfGncXlz8eRkC6itgtOul/aDhTeHz.qBBXk6hss4xyBbT.cpgn6'

  worker:
    image: ghcr.io/dataforgoodfr/14_vcmwaterwatch/worker:latest
    pull_policy: always
    expose:
      - 3000
    environment:
      - NOCODB_BASE_ID=${NOCODB_BASE_ID}
      - NOCODB_TOKEN=${NOCODB_TOKEN}
      - NOCODB_URL=${NOCODB_URL:-http://nocodb:8080}
      - PM_TILES_DIR=${PM_TILES_DIR:-/public/pmtiles}
      - COUNTRY_IMAGES_DIR=${COUNTRY_IMAGES_DIR:-/public/country-images}
    depends_on:
      - nocodb
    restart: unless-stopped
    volumes:
      - pmtiles-data:/public/pmtiles
      - country-images-data:/public/country-images

volumes:
  nocodb-data:
  pmtiles-data:
  country-images-data:
