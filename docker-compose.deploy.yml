services:
  webapp:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        - NOCODB_BASE_ID=${NOCODB_BASE_ID}
        - NOCODB_URL=${NOCODB_URL}
        - NOCODB_TOKEN=${NOCODB_TOKEN}
    expose:
      - 3000
    environment:
      - NOCODB_BASE_ID=${NOCODB_BASE_ID}
      - NOCODB_URL=${NOCODB_URL}
      - NOCODB_TOKEN=${NOCODB_TOKEN}
    restart: unless-stopped
