services:
  # Not used!  This is normally provided by Coolify (in resources)
  # postgres:
  #   image: postgres:18-alpine
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-nocodb}
  #     POSTGRES_USER: ${POSTGRES_USER:-nocodb}
  #     # generated by Coolify
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #     PGDATA: /var/lib/postgresql/data
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nocodb}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   restart: unless-stopped

  nocodb:
    image: "nocodb/nocodb:0.301.1"
    expose:
      - 8080
    # To expose the port on the host
    # ports:
    #   - "8500:8080"
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    environment:
      # Set up POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and POSTGRES_SERVER in Coolify
      NC_DB: "pg://${POSTGRES_SERVER:-postgres}:5432?u=${POSTGRES_USER:-nocodb}&p=${POSTGRES_PASSWORD:-changeme}&d=${POSTGRES_DB:-nocodb}"
    volumes:
      - nocodb-data:/usr/app/data
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    expose:
      - 3000
    environment:
      # Provide those in the Coolify UI
      - NOCODB_BASE_ID=${NOCODB_BASE_ID}
      - NOCODB_TOKEN=${NOCODB_TOKEN}
      - NOCODB_URL=${NOCODB_URL:-http://nocodb:8080}
      - NODE_ENV=production
      # Limit mem - otherwise it won't build on the Coolify VM
      - NODE_OPTIONS=--max-old-space-size=1536
    depends_on:
      - nocodb
    restart: unless-stopped

volumes:
  nocodb-data:
