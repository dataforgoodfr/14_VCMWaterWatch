name: Vitest Tests

on:
  workflow_call:
  pull_request:
    paths:
      - "webapp/**"
  push:
    branches: [main]
    paths:
      - "webapp/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: webapp
        run: npm ci
      - name: Run tests
        working-directory: webapp
        run: npm test
