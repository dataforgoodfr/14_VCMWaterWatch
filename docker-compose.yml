# Used for local development - starts a local nocodb instance with postgres backend
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: nocodb
      PG_DATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb"]
      interval: 5s
      timeout: 3s
      retries: 5

  nocodb:
    image: "nocodb/nocodb:0.301.1"
    ports:
      - "8500:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NC_DB: "pg://postgres:5432?u=nocodb&p=nocodb&d=nocodb"
    volumes:
      - nocodb-data:/usr/app/data

volumes:
  postgres-data:
  nocodb-data:
